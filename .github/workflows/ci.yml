name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Runs cargo fmt --all -- --check, cargo clippy --all-targets -- -D warnings,
      # cargo test --workspace --verbose, and cargo audit --deny warnings.
      - name: Run pre-push checks and workspace tests
        run: ./scripts/pre_push.sh --workspace --verbose
