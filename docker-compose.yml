version: '3.8'

services:
  simply-ip-sync:
    build: .
    container_name: simply_ip_sync
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=sqlite://data/simply_ip_sync.db?mode=rwc
      - RUST_LOG=info
      - BIND_HOST=0.0.0.0
      - PORT=3003
      # - SYNC_ENCRYPTION_KEY=
      # - INITIAL_MASTER_KEY=
      # - TRUSTED_PROXIES=
      # - MAX_BODY_SIZE_MIB=
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3003/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
